<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BASIL's Journal</title>
  <link id="favicon" rel="icon" type="image/png" href="img/mainlogo.png">
  <meta name="description" content="Memories">
  <meta property="og:title" content="BASIL's Journal">
  <meta property="og:image" content="https://basils-journal.vercel.app/img/mainlogo.png">
  <meta name="theme-color" content="#f0b429">
  <script>var t="light";try{t=localStorage.getItem("artblk-theme")||localStorage.getItem("theme")||"light"}catch(e){}document.documentElement.dataset.theme=t</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="sheet">
    <header class="site-header">
      <div class="brand-block">
        <div class="brand">
          <span class="logo" id="server-logo" aria-hidden="true">Logo</span>
          <strong id="server-name">Server</strong>
        </div>
      </div>


      <div class="tools">
        <button class="tool" id="music-toggle" type="button" aria-pressed="false" aria-label="Theme music"><span aria-hidden="true">🔇</span></button>
        <button class="tool" id="theme-toggle" type="button"><span aria-hidden="true">🌙</span></button>
      </div>
    </header>
    <audio id="theme-audio" loop autoplay preload="auto"></audio>

    <div class="book-area">
      <div class="frame">
        <span class="corner tl" aria-hidden="true"></span>
        <span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span>
        <span class="corner br" aria-hidden="true"></span>
        <main id="main"></main>
      </div>

      <nav aria-label="journal sections">
        <div class="tablist" role="tablist" id="tablist" aria-label="journal sections"></div>
      </nav>
    </div>

    <footer class="site-footer">
      <p id="footer-text"></p>
      <p class="server-ip">Server IP: <span id="footer-ip"></span></p>
    </footer>
  </div>

  <!-- POP-UP WINDOW -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button class="modal-close" type="button" data-close aria-label="Close window"></button>
      <div class="modal-scroll" id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
