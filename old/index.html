<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BASIL's Journal</title>
  <meta name="description" content="Boss strategies, progression, mechanics and rules for the Art Blk SMP Minecraft server.">
  <!-- Light mode is the default; a visitor's saved choice is applied before the page paints, so there is no light flash in dark mode. -->
  <script>var t="light";try{t=localStorage.getItem("artblk-theme")||"light"}catch(e){}document.documentElement.dataset.theme=t</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="sheet">
    <!-- TITLE PLATE. Left: name and season stamp. Right: music and dark-mode toggles. -->
    <header class="site-header">
      <div class="brand-block">
        <div class="brand">
          <span class="logo" id="server-logo" aria-hidden="true">Logo</span>
          <strong id="server-name">Server</strong>
          <span class="stamp" id="season"></span>
        </div>
      </div>

      <!-- TOP-RIGHT TOGGLES -->
      <div class="tools">
        <button class="tool" id="music-toggle" type="button" aria-pressed="false" aria-label="Theme music"><span aria-hidden="true">🔇</span></button>
        <button class="tool" id="theme-toggle" type="button"><span aria-hidden="true">🌙</span></button>
      </div>
    </header>
    <audio id="theme-audio" src="audio/theme.mp3" autoplay loop preload="auto"></audio>

    <div class="book-area">
      <!-- THE BOOK -->
      <div class="frame">
        <span class="corner tl" aria-hidden="true"></span>
        <span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span>
        <span class="corner br" aria-hidden="true"></span>
        <main id="main"></main>
      </div>

      <!-- INDEX TABS -->
      <nav aria-label="Wiki sections">
        <div class="tablist" role="tablist" id="tablist" aria-label="Wiki sections"></div>
      </nav>
    </div>

    <!-- FOOTER. Left text = serverData.footer. Right = Server IP (serverData.ip). -->
    <footer class="site-footer">
      <p id="footer-text"></p>
      <p class="server-ip-footer" id="footer-ip-wrap">🌐 Server IP: <button type="button" class="ip-copy-inline" id="footer-ip" title="Click to copy Server IP"></button></p>
    </footer>
  </div>

  <!-- POP-UP WINDOW -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button class="modal-close" type="button" data-close aria-label="Close window">&times;</button>
      <div class="modal-scroll" id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
